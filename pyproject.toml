[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jrc-moe"
version = "0.1.0"
description = "Paper-faithful REFLEX RRB and FPS-FGER replication on LLaDA-MoE"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "datasets<4",
  "lm_eval==0.4.8",
  "matplotlib",
  "numpy",
  "pandas",
  "psutil",
  "pyyaml>=6",
  "safetensors",
  "torch>=2.7",
  "transformers==4.53.2",
]

[project.scripts]
jrc-moe = "jrc_moe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

